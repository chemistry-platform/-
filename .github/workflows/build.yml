name: Build Signed Release APK & GitHub Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or not set. A permanent upload keystore is required so updates can install over existing versions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          if [ ! -s "${{ github.workspace }}/my-upload-key.jks" ]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi

      - name: Grant execute permission for Gradle
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          GITHUB_REPO: ${{ github.repository }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to app-release.apk
        run: |
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          cp "$BUILT_APK" app-release.apk

      - name: Print APK Top 20 Largest Entries & Verify <= 40 MB
        run: |
          python3 -c '
          import os, zipfile, sys
          size = os.path.getsize("app-release.apk")
          print(f"app-release.apk size: {size:,} bytes ({size / (1024*1024):.2f} MB)")
          with zipfile.ZipFile("app-release.apk") as z:
              entries = sorted([(i.compress_size, i.file_size, i.filename) for i in z.infolist()], reverse=True)
              print("Top 20 largest entries (compressed -> uncompressed):")
              for idx, (cs, fs, fn) in enumerate(entries[:20], 1):
                  print(f"  {idx:2d}. {cs/1024/1024:6.2f} MB (raw {fs/1024/1024:6.2f} MB)  {fn}")
          if size > 40 * 1024 * 1024:
              print("::error::app-release.apk exceeds 40 MB target!")
              sys.exit(1)
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "v1.0.${{ github.run_number }}"
          files: app-release.apk
          make_latest: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          retention-days: 30
